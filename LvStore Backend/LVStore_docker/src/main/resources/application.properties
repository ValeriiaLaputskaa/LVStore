spring.application.name=LVStore
server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

lvstore.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Google OAuth2 (опційно): задати id/secret через змінні середовища або нижче.
# Після цього на бекенді активується oauth2Login; редирект у фронт — FRONTEND_BASE_URL.
# spring.security.oauth2.client.registration.google.client-id=
# spring.security.oauth2.client.registration.google.client-secret=
# spring.security.oauth2.client.registration.google.scope=openid,email,profile
# Альтернатива: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID / _CLIENT_SECRET / _SCOPE

springdoc.api-docs.path=/api-docs/openapi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

spring.mvc.pathmatch.matching-strategy=ant-path-matcher
